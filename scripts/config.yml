# -------------------------------------------------------------------
# JIRA CONFIGURATION
# -------------------------------------------------------------------
jira:
  # Replace with your company JIRA URL (exp: https://company.atlassian.net)
  url: "https://senagrun.atlassian.net"
  
  # SECURITY NOTE:
  # Do NOT write your Email or API Token here.
  # For security, the script reads these from environment variables:
  # - JIRA_EMAIL
  # - JIRA_TOKEN
  # enable_links: false

