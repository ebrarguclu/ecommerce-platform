# BITBUCKET CONFIGURATION
# -------------------------------------------------------------------
bitbucket:
  #Replace with your Bitbucket Workspace name
  workspace: "senagrun-dev"
  #Replace with your Bitbucket Repository name (slug)
  repo_slug: "ecommerce-platform"
  
  # NOTE: Use the BITBUCKET_TOKEN environment variable for Bitbucket API access if needed.
