</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="fas fa-shopping-bag"></i> ShopHub
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Ana Sayfa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="products.html">Urunler</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">
                            <i class="fas fa-shopping-cart"></i>

                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">
                            <i class="fas fa-user"></i> Giris

                </ul>

            <h2 class="mb-0"><i class="fas fa-shopping-bag"></i> Urunler</h2>
        </div>
    </section>

    <section class="py-5">
        <div class="container">

                <div class="col-md-6 mb-3">
                    <div class="input-group">
                        <input type="text" id="search-input" class="form-control" placeholder="Urun ara...">
                        <button class="btn btn-primary" onclick="searchProducts()">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
                
                <div class="col-md-6 mb-3">
                    <select id="category-filter" class="form-select" onchange="filterByCategory()">
                        <option value="Tumu">Tum Kategoriler</option>
                    </select>
                </div>
            </div>

            <div id="products-container" class="row g-4">
            </div>

            <div id="no-results" class="alert alert-info text-center d-none">
                <i class="fas fa-info-circle"></i> Aradiginiz kriterlere uygun urun bulunamadi.
            </div>
        </div>
    </section>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 ShopHub E-Commerce Platform</p>
        </div>
