<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepetim - E-Commerce Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="fas fa-shopping-bag"></i> ShopHub
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <h2><i class="fas fa-shopping-cart"></i> Sepetim</h2>
        
        <!-- Cart Items -->
        <div class="card mt-4">
            <div class="card-body">
                <div class="row align-items-center mb-3 pb-3 border-bottom">
                    <div class="col-md-2">
                        <img src="https://via.placeholder.com/100" class="img-fluid" alt="Product">
                    </div>
                    <div class="col-md-4">
                        <h5>iPhone 15 Pro Max</h5>
                        <p class="text-muted mb-0">256GB, Titanyum Mavisi</p>
                    </div>
                    <div class="col-md-2">
                        <div class="input-group">
                            <button class="btn btn-outline-secondary btn-sm">-</button>
                            <input type="text" class="form-control form-control-sm text-center" value="1">
                            <button class="btn btn-outline-secondary btn-sm">+</button>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <h5 class="text-primary">52.999 TL</h5>
                    </div>
                    <div class="col-md-2 text-end">
                        <button class="btn btn-danger btn-sm">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>

                <div class="row align-items-center mb-3 pb-3 border-bottom">
                    <div class="col-md-2">
                        <img src="https://via.placeholder.com/100" class="img-fluid" alt="Product">
                    </div>
                    <div class="col-md-4">
                        <h5>AirPods Pro 2</h5>
                        <p class="text-muted mb-0">USB-C Sarj Kutusu</p>
                    </div>
                    <div class="col-md-2">
                        <div class="input-group">
                            <button class="btn btn-outline-secondary btn-sm">-</button>
                            <input type="text" class="form-control form-control-sm text-center" value="2">
                            <button class="btn btn-outline-secondary btn-sm">+</button>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <h5 class="text-primary">19.998 TL</h5>
                    </div>
                    <div class="col-md-2 text-end">
                        <button class="btn btn-danger btn-sm">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cart Summary -->
        <div class="row mt-4">
            <div class="col-md-8"></div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Siparis Ozeti</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Ara Toplam:</span>
                            <strong>72.997 TL</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Kargo:</span>
                            <strong class="text-success">Ucretsiz</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>KDV (%20):</span>
                            <strong>14.599 TL</strong>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-3">
                            <h5>Toplam:</h5>
                            <h5 class="text-primary">87.596 TL</h5>
                        </div>
                        <button class="btn btn-success w-100">
                            <i class="fas fa-credit-card"></i> Odemeye Gec
                        </button>
                        <button class="btn btn-outline-secondary w-100 mt-2">
                            <i class="fas fa-arrow-left"></i> Alisverise Devam
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
